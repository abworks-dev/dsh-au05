name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Specs import the workspace packages by name (@abworks/dsh-plugin-au05,
      # @abworks/dsh-studio-hook); npm link them from the "workspaces" field, so
      # the install has to happen before the suite resolves those imports.
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run demo
  visual:
    # Committed baselines are Chromium-on-Windows pixels; playwright.config.mjs refuses to run
    # them on another host and refuses to update them under CI.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run test:visual
      - run: npm run test:visual:negative
      - run: npm run test:visual:layout -- --out test-results/layout
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: au05-visual-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7
